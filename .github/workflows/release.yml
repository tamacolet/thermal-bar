name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install macmon
        run: brew install macmon

      - name: Build release dmg
        run: |
          V="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || V=""
          VERSION="$V" BUILD_NUMBER="${GITHUB_RUN_NUMBER:-1}" ./build.sh --release

      - name: Create GitHub Release
        if: github.event_name == 'push'
        run: |
          if response=$(gh api --include --silent "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"); then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving release and assets unchanged."
          elif [ "$(printf '%s\n' "$response" | awk 'NR == 1 {print $2}')" = "404" ]; then
            gh release create "$GITHUB_REF_NAME" build/ThermalBar.dmg --generate-notes
          else
            echo "::error::Could not check release ${GITHUB_REF_NAME}; refusing to create it."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ThermalBar
          path: build/ThermalBar.dmg
